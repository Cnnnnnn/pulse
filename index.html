<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- P0 安全：只允许本地资源。远程图片/媒体显式放开（新闻封面、电影海报）。
       connect-src 'none'：网络一律走主进程 IPC。script 不允许 inline/eval。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; worker-src 'self' blob:;">
  <title>Pulse</title>
  <script src="fouc.js"></script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <!-- 业务 CSS 由 JS chunk 按需注入（scripts/build-renderer.cjs inject-css）；
       不再预载 renderer-dist/index.css。 -->
</head>
<body>
  <!-- 拖拽区域 (macOS title bar) -->
  <div id="titlebar"></div>

  <!-- 渲染挂载点: Preact 接管整个 <App/> 树 -->
  <div id="app">
    <!-- 启动前兜底, 防止白屏 -->
    <div class="boot-skeleton">
      <div class="boot-skeleton-header"></div>
      <div class="boot-skeleton-content">
        <div class="boot-skeleton-line"></div>
        <div class="boot-skeleton-line short"></div>
      </div>
    </div>
  </div>

  <!-- esbuild 产物: src/renderer/index.jsx → renderer-dist/index.js (+ lazy chunks) -->
  <script type="module" src="renderer-dist/index.js"></script>
</body>
</html>
