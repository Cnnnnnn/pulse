name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同分支新 push 取消老 run, 不浪费 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test + Build renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite/Rolldown 与 electron-rebuild 当前要求 Node >=22.12；
          # 固定到已验证的 LTS 版本，避免 optional native binding 缺失。
          node-version: 22.23.2
          cache: npm

      - name: Pin npm to last-known-good
        run: npm install -g npm@10.9.8

      - name: Override registry to public npm
        # 本地 ~/.npmrc 指向 nexus.npt.seabank.io (公司私有 proxy), 在
        # GitHub runner 上 DNS 不通 (ENOTFOUND), 装 preact 之类直接挂.
        # CI 显式切到公共 registry, lockfile 的 integrity hash 还能校验.
        run: |
          npm config delete registry
          npm config delete //nexus.npt.seabank.io/repository/npm-bank/:_authToken
          npm config delete //nexus.npt.seabank.io/repository/npm-bank-hosted/:_authToken
          npm config delete //npm.shopee.io/:_authToken
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Install deps
        # npm 在 GitHub runner 的 lifecycle 阶段会偶发 "Exit handler never
        # called!"；pnpm 搭配已提交的锁文件可稳定安装各平台 native binding。
        run: |
          npm install -g pnpm@9.15.9
          pnpm install --frozen-lockfile --reporter=append-only

      - name: Run unit tests
        # pnpm test 的 pretest 会先生成 dist/main 与 dist/workers，供
        # worker-pool 的真实 worker_threads 集成测试加载。
        run: pnpm test -- --run --watch=false

      # ponytail: 2026-07-08 — 新 CSS stylelint 严格 (仅 src/renderer/components/**).
      # 老 styles.css 与全局暂未强约束 (设计系统文档规范), 避免爆历史债.
      - name: Lint component CSS
        run: pnpm run lint:css

      # ESLint: warn 为主，CI 当前不阻断（|| true），仅报告问题。
      # 31 个历史 error + 212 个 warning 待逐步清理；清理完后可移除 || true 让 CI 阻断。
      # 开发者本地 npm run lint 可看到全部问题。
      - name: Lint JS
        run: pnpm run lint -- --max-warnings=9999 || true

      - name: Build renderer bundle
        run: npm run build:renderer

      - name: Verify bundle produced
        run: |
          test -f renderer-dist/index.js
          echo "entry size: $(du -h renderer-dist/index.js | cut -f1)"
          echo "chunks: $(ls renderer-dist/chunk-*.js 2>/dev/null | wc -l | tr -d ' ')"

      # 结构化视觉规范在 Ubuntu CI 运行；人工审阅的像素基线仅在 macOS 本机运行，
      # 避免跨平台字体/emoji 渲染差异造成无意义的像素失败。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Visual regression
        run: |
          pnpm exec playwright install chromium --with-deps
          pnpm run test:visual
          # 失败时把 diff 图 archive 出来, 方便本地 debug
          if [ -d test-results ]; then
            echo "test-results/ contents:"
            find test-results -name "*.png" | head -20
          fi

      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
